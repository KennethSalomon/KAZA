name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint --workspace apps/web

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-anon-key-no-secret
          NEXT_PUBLIC_APP_URL: https://ci-build.kaza.local
          NEXT_PUBLIC_HCAPTCHA_SITEKEY: ci-build-sitekey-no-secret

      - name: Secret leak scan (frontend + edge functions)
        run: |
          if grep -rnEi "(sk_live_|sk_dev_|sbp_[A-Za-z0-9]{16,}|vcp_[A-Za-z0-9]{16,}|xkeysib-|xox[bap]-|service_role\s*[:=]\s*['\"][a-zA-Z0-9]{20,}|BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY|KazaDemo)" apps/web/src supabase/functions | grep -vE ':[0-9]+: \*|:[0-9]+: //' ; then
            echo "::error::Secret ou clé détecté(e) dans le code source. Retirez-le avant de merger."
            exit 1
          fi

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Supabase CLI (pinned)
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.114.0/supabase_linux_amd64.tar.gz -o /tmp/supabase.tar.gz
          tar xzf /tmp/supabase.tar.gz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase
          supabase --version

      - name: Diagnose Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import urllib.error
          import urllib.request

          username = os.environ.get("DOCKERHUB_USERNAME", "")
          token = os.environ.get("DOCKERHUB_TOKEN", "")

          print(f"USERNAME_LENGTH={len(username)}")
          print(f"TOKEN_LENGTH={len(token)}")
          print(f"USERNAME_HAS_CR={str(chr(13) in username).lower()}")
          print(f"USERNAME_HAS_LF={str(chr(10) in username).lower()}")
          print(f"TOKEN_HAS_CR={str(chr(13) in token).lower()}")
          print(f"TOKEN_HAS_LF={str(chr(10) in token).lower()}")
          print(f"TOKEN_STARTS_WITH_DCKR_PAT={str(token.startswith('dckr_pat_')).lower()}")

          payload = json.dumps({
              "identifier": username,
              "secret": token,
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://hub.docker.com/v2/auth/token",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          status = 0
          body = {}
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
                  try:
                      body = json.loads(response.read().decode("utf-8"))
                  except Exception:
                      body = {}
          except urllib.error.HTTPError as error:
              status = error.code
          except Exception:
              status = 0

          print(f"DOCKER_HUB_AUTH_HTTP_STATUS={status}")

          if status == 200 and isinstance(body, dict) and body.get("access_token"):
              print("DOCKER_HUB_AUTH_RESULT=SUCCESS")
          else:
              print("DOCKER_HUB_AUTH_RESULT=FAILURE")
              raise SystemExit(1)
          PYEOF

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Start Supabase local
        id: supabase
        run: |
          for i in 1 2 3 4; do
            if supabase start; then break; fi
            echo "supabase start (tentative $i) échouée — nouvel essai dans 30s (rate limit Docker Hub)..."
            sleep 30
          done
          env_vars=$(supabase status -o env)
          anon_key=$(printf '%s\n' "$env_vars" | grep -iE '^anon_key=' | cut -d= -f2- | tr -d '"' | tr -d '[:space:]')
          service_role_key=$(printf '%s\n' "$env_vars" | grep -iE '^service_role_key=' | cut -d= -f2- | tr -d '"' | tr -d '[:space:]')
          if [ -z "$anon_key" ] || [ -z "$service_role_key" ]; then
            echo "::error::Impossible de récupérer les clés Supabase via 'supabase status -o env'."
            printf '%s\n' "$env_vars" | head -40
            exit 1
          fi
          echo "ANON_KEY=$anon_key" >> "$GITHUB_OUTPUT"
          echo "SERVICE_ROLE_KEY=$service_role_key" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Reset database
        run: supabase db reset
        working-directory: .

      - name: DB types drift check
        run: npm run db:types:check
        id: types-check

      - name: Upload generated types (debug artifact)
        if: always() && steps.types-check.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: database-types-generated
          path: apps/web/src/lib/database.types.ts
          if-no-files-found: warn

      - name: Install CI-only test helpers
        run: |
          cat >/tmp/kaza-ci-test-helpers.sql <<'SQL'
          create or replace function public.get_function_source(p_function_name text)
          returns text
          language plpgsql
          security definer
          set search_path = public
          as $
          declare
            v_source text;
          begin
            if auth.role() <> 'service_role' then
              raise exception 'Test-only helper';
            end if;
            select pg_get_functiondef(oid) into v_source
              from pg_proc
             where proname = p_function_name
               and pronamespace = 'public'::regnamespace
             limit 1;
            if v_source is null then
              raise exception 'Function % not found', p_function_name;
            end if;
            return v_source;
          end;
          $;

          revoke all on function public.get_function_source(text) from public, anon, authenticated;
          grant execute on function public.get_function_source(text) to service_role;

          create or replace function public.reset_test_database()
          returns void
          language plpgsql
          security definer
          set search_path = public
          as $
          begin
            if auth.role() <> 'service_role' then
              raise exception 'Test-only helper';
            end if;

            delete from public.favorites;
            delete from public.messages;
            delete from public.receipts;
            delete from public.payments;
            delete from public.visits;
            delete from public.conversations;
            delete from public.leases;
            delete from public.notifications;
            delete from public.admin_audit_logs;
            delete from public.residences;
          end;
          $;

          revoke all on function public.reset_test_database() from public, anon, authenticated;
          grant execute on function public.reset_test_database() to service_role;
          SQL
          docker exec -i supabase_db_kaza psql -U postgres -d postgres -v ON_ERROR_STOP=1 < /tmp/kaza-ci-test-helpers.sql
        working-directory: .

      - name: Run DB integration tests
        run: npx vitest run -c vitest.config.integration.ts tests/integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321/
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.SERVICE_ROLE_KEY }}
        working-directory: .

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Supabase CLI (pinned)
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.114.0/supabase_linux_amd64.tar.gz -o /tmp/supabase.tar.gz
          tar xzf /tmp/supabase.tar.gz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Start Supabase local
        id: supabase
        run: |
          for i in 1 2 3 4; do
            if supabase start; then break; fi
            echo "supabase start (tentative $i) échouée — nouvel essai dans 30s..."
            sleep 30
          done
          env_vars=$(supabase status -o env)
          anon_key=$(printf '%s\n' "$env_vars" | grep -iE '^anon_key=' | cut -d= -f2- | tr -d '"' | tr -d '[:space:]')
          if [ -z "$anon_key" ]; then
            echo "::error::Impossible de récupérer l'ANON_KEY."
            printf '%s\n' "$env_vars" | head -40
            exit 1
          fi
          echo "ANON_KEY=$anon_key" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Reset database
        run: supabase db reset
        working-directory: .

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: apps/web

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321/
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000/
          NEXT_PUBLIC_HCAPTCHA_SITEKEY: ""
        working-directory: .

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Supabase CLI (pinned)
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.114.0/supabase_linux_amd64.tar.gz -o /tmp/supabase.tar.gz
          tar xzf /tmp/supabase.tar.gz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.3.3

      - name: Lint Edge Functions (Deno)
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "Checking $f..."
            deno lint "$f" || exit 1
          done
        working-directory: .

      - name: Typecheck Edge Functions (Deno)
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "Typechecking $f..."
            # --config : Deno ne découvre pas supabase/functions/deno.json depuis la
            # racine du repo ; sans lui, les imports npm: sont résolus contre le
            # node_modules npm de la racine (échec sur npm:@sentry/deno) au lieu du
            # cache global + deno.lock des Edge Functions.
            deno check --config supabase/functions/deno.json "$f" || exit 1
          done
        working-directory: .

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high --workspace apps/web