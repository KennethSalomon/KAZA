name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint --workspace apps/web

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-anon-key-no-secret
          NEXT_PUBLIC_APP_URL: https://ci-build.kaza.local
          NEXT_PUBLIC_HCAPTCHA_SITEKEY: ci-build-sitekey-no-secret

      - name: Secret leak scan (frontend + edge functions)
        run: |
          if rg -n --no-ignore -i "(sk_live_|sk_dev_|sbp_[A-Za-z0-9]{16,}|vcp_[A-Za-z0-9]{16,}|xkeysib-|xox[bap]-|service_role|BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY|KazaDemo)" apps/web/src supabase/functions; then
            echo "::error::Secret ou clé détecté(e) dans le code source. Retirez-le avant de merger."
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Supabase CLI
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz -o /tmp/supabase.tar.gz
          tar xzf /tmp/supabase.tar.gz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase

      - name: Start Supabase local
        id: supabase
        run: |
          set +e
          output=$(supabase start 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ]; then
            echo "::group::supabase start --debug"
            supabase start --debug 2>&1 || true
            echo "::endgroup::"
            exit $code
          fi
          anon_key=$(echo "$output" | grep -oP 'anon key:\s*\K\S+')
          echo "ANON_KEY=$anon_key" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Reset database
        run: supabase db reset
        working-directory: .

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: apps/web

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_HCAPTCHA_SITEKEY: ""
        working-directory: .

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
