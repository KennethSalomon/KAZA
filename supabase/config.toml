# KAZA.BJ — configuration Supabase locale (CLI)
project_id = "kaza"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "20MiB"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[edge_runtime.secrets]
# ⚠️ NE PAS stocker de vrais secrets ici — configure-les dans le Dashboard Supabase > Edge Functions > Secrets.
FEDAPAY_SECRET_KEY = "CHANGEME_sk_dev_fedapay"
FEDAPAY_API_BASE = "https://sandbox-api.fedapay.com/v1"
FEDAPAY_WEBHOOK_SECRET = "CHANGEME_wh_dev_secret"
CRON_SECRET = "CHANGEME_dev-cron-secret"
BREVO_API_KEY = "CHANGEME_brevo_api_key"
BREVO_SENDER_EMAIL = "noreply@kaza.bj"
BREVO_SENDER_NAME = "KAZA.BJ"
APP_URL = "http://localhost:3000"

[functions.fedapay-init]
verify_jwt = true

[functions.fedapay-webhook]
verify_jwt = false

[functions.receipts-sign]
verify_jwt = true

[functions.overdue-cron]
verify_jwt = false

[analytics]
enabled = false