# KAZA.BJ — PostgreSQL de repli (option B).
# Le setup recommandé est le CLI Supabase (Auth + Storage + Realtime + Edge Functions).
# Ce compose démarre uniquement la base identique à celle du CLI (postgis intégré).

services:
  db:
    image: supabase/postgres:15.8.1.078
    container_name: kaza-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kaza
    ports:
      - "5432:5432"
    volumes:
      - kaza_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kaza"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kaza_pgdata: